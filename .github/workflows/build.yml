name: Build iOS Redirector Dylib

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Tweak.m and Compile Redirector.dylib
        run: |
          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <SafariServices/SafariServices.h>
          #import <objc/runtime.h>

          static NSString * const kTargetTelegramURL = @"https://t.me/rvkqq";
          static NSString * const kAllowedIdentifier = @"t.me/rvkqq";
          static NSString * const kRecursionGuardKey = @"com.rvkqq.redirector.recursion_guard";

          static BOOL ShouldRedirectURLString(NSString *urlString) {
              if (!urlString || ![urlString isKindOfClass:[NSString class]] || urlString.length == 0) {
                  return NO;
              }
              NSString *lower = [urlString lowercaseString];
              if ([lower containsString:kAllowedIdentifier]) {
                  return NO;
              }
              static NSArray<NSString *> *blockedKeywords = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  blockedKeywords = @[
                      @"t.me/",
                      @"telegram.me",
                      @"discord.gg",
                      @"discord.com",
                      @"khoindvn",
                      @"khoindns",
                      @"yyyue.xyz",
                      @"esign"
                  ];
              });
              for (NSString *keyword in blockedKeywords) {
                  if ([lower containsString:keyword]) {
                      return YES;
                  }
              }
              return NO;
          }

          static NSURL *RedirectedURLIfNeeded(NSURL *originalURL) {
              if (!originalURL || ![originalURL isKindOfClass:[NSURL class]]) {
                  return originalURL;
              }
              NSString *urlString = [originalURL absoluteString];
              if (ShouldRedirectURLString(urlString)) {
                  return [NSURL URLWithString:kTargetTelegramURL];
              }
              return originalURL;
          }

          static id (*orig_NSURL_URLWithString)(id, SEL, NSString *);
          static BOOL (*orig_UIApp_openURL)(id, SEL, NSURL *);
          static void (*orig_UIApp_openURL_options_completion)(id, SEL, NSURL *, NSDictionary *, void (^)(BOOL));
          static id (*orig_SFSafari_initWithURL)(id, SEL, NSURL *);
          static id (*orig_SFSafari_initWithURL_config)(id, SEL, NSURL *, SFSafariViewControllerConfiguration *);

          static id swizzled_NSURL_URLWithString(id self, SEL _cmd, NSString *URLString) {
              NSMutableDictionary *threadDict = [[NSThread currentThread] threadDictionary];
              if ([threadDict[kRecursionGuardKey] boolValue]) {
                  return orig_NSURL_URLWithString(self, _cmd, URLString);
              }
              if (ShouldRedirectURLString(URLString)) {
                  threadDict[kRecursionGuardKey] = @YES;
                  id redirectedURL = orig_NSURL_URLWithString(self, _cmd, kTargetTelegramURL);
                  threadDict[kRecursionGuardKey] = @NO;
                  return redirectedURL;
              }
              return orig_NSURL_URLWithString(self, _cmd, URLString);
          }

          static BOOL swizzled_UIApp_openURL(id self, SEL _cmd, NSURL *url) {
              return orig_UIApp_openURL(self, _cmd, RedirectedURLIfNeeded(url));
          }

          static void swizzled_UIApp_openURL_options_completion(id self, SEL _cmd, NSURL *url, NSDictionary *options, void (^completion)(BOOL success)) {
              orig_UIApp_openURL_options_completion(self, _cmd, RedirectedURLIfNeeded(url), options, completion);
          }

          static id swizzled_SFSafari_initWithURL(id self, SEL _cmd, NSURL *URL) {
              return orig_SFSafari_initWithURL(self, _cmd, RedirectedURLIfNeeded(URL));
          }

          static id swizzled_SFSafari_initWithURL_config(id self, SEL _cmd, NSURL *URL, SFSafariViewControllerConfiguration *configuration) {
              return orig_SFSafari_initWithURL_config(self, _cmd, RedirectedURLIfNeeded(URL), configuration);
          }

          static void SwizzleInstanceMethod(Class cls, SEL selector, IMP newImp, IMP *origImpOut) {
              if (!cls) return;
              Method method = class_getInstanceMethod(cls, selector);
              if (!method) return;
              if (origImpOut) *origImpOut = method_getImplementation(method);
              if (!class_addMethod(cls, selector, newImp, method_getTypeEncoding(method))) {
                  method_setImplementation(method, newImp);
              }
          }

          static void SwizzleClassMethod(Class cls, SEL selector, IMP newImp, IMP *origImpOut) {
              if (!cls) return;
              Method method = class_getClassMethod(cls, selector);
              if (!method) return;
              Class metaCls = object_getClass((id)cls);
              if (origImpOut) *origImpOut = method_getImplementation(method);
              if (!class_addMethod(metaCls, selector, newImp, method_getTypeEncoding(method))) {
                  method_setImplementation(method, newImp);
              }
          }

          __attribute__((constructor))
          static void InitializeRedirectorTweak(void) {
              @autoreleasepool {
                  SwizzleClassMethod([NSURL class], @selector(URLWithString:), (IMP)swizzled_NSURL_URLWithString, (IMP *)&orig_NSURL_URLWithString);
                  Class appClass = [UIApplication class];
                  SwizzleInstanceMethod(appClass, @selector(openURL:), (IMP)swizzled_UIApp_openURL, (IMP *)&orig_UIApp_openURL);
                  SwizzleInstanceMethod(appClass, @selector(openURL:options:completionHandler:), (IMP)swizzled_UIApp_openURL_options_completion, (IMP *)&orig_UIApp_openURL_options_completion);
                  Class safariClass = [SFSafariViewController class];
                  if (safariClass) {
                      SwizzleInstanceMethod(safariClass, @selector(initWithURL:), (IMP)swizzled_SFSafari_initWithURL, (IMP *)&orig_SFSafari_initWithURL);
                      SwizzleInstanceMethod(safariClass, @selector(initWithURL:configuration:), (IMP)swizzled_SFSafari_initWithURL_config, (IMP *)&orig_SFSafari_initWithURL_config);
                  }
              }
          }
          EOF

          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework Foundation \
            -framework UIKit \
            -framework SafariServices \
            -install_name @executable_path/Frameworks/Redirector.dylib \
            Tweak.m \
            -o Redirector.dylib

      - name: Upload Redirector.dylib to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redirector-dylib
          path: Redirector.dylib
          if-no-files-found: error

      - name: Publish Direct Download in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Готовый Redirector.dylib (Сборка #${{ github.run_number }})"
          files: Redirector.dylib